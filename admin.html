<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFDS EOI - Admin Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 30px;
    }
    h1 {
      margin-top: 0;
      color: #00205b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      background-color: #f05b22;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      background-color: #d04a1a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #475569;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:hover {
      background-color: #f8fafc;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      background-color: #e0e7ff;
      color: #4338ca;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      Captured Expressions of Interest
      <button class="btn" onclick="downloadCSV()" id="downloadBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download CSV
      </button>
    </h1>
    
    <div id="loading" style="text-align: center; padding: 40px; color: #64748b;">Loading data...</div>
    
    <table id="dataTable" style="display: none;">
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Section</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Rows will be inserted here -->
      </tbody>
    </table>
    
    <div id="emptyState" class="empty-state" style="display: none;">
      No submissions found.
    </div>
  </div>

  <script>
    let submissionsData = [];

    async function loadData() {
      try {
        const response = await fetch('/api/eoi');
        const data = await response.json();
        
        document.getElementById('loading').style.display = 'none';
        
        if (data.submissions && data.submissions.length > 0) {
          submissionsData = data.submissions;
          document.getElementById('dataTable').style.display = 'table';
          document.getElementById('downloadBtn').disabled = false;
          
          const tbody = document.getElementById('tableBody');
          data.submissions.forEach(sub => {
            const tr = document.createElement('tr');
            const fullName = sub.lastName ? `${sub.firstName} ${sub.lastName}` : sub.firstName;
            tr.innerHTML = `
              <td style="font-size: 13px; color: #64748b;">${new Date(sub.receivedAt).toLocaleString()}</td>
              <td style="font-weight: 600;">${fullName}</td>
              <td><a href="mailto:${sub.email}" style="color: #00205b;">${sub.email}</a></td>
              <td>${sub.phone || '-'}</td>
              <td><span class="badge">${sub.role}</span></td>
              <td style="font-size: 13px;">${sub.sectionName}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          document.getElementById('emptyState').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('loading').textContent = 'Error loading data. Check console.';
        console.error(err);
      }
    }

    function downloadCSV() {
      if (submissionsData.length === 0) return;
      
      const headers = ['Date', 'Full Name', 'Email', 'Phone', 'Role', 'Section', 'Reference ID'];
      
      const csvRows = [headers.join(',')];
      
      submissionsData.forEach(sub => {
        const fullName = sub.lastName ? `${sub.firstName} ${sub.lastName}` : sub.firstName;
        const row = [
          `"${new Date(sub.receivedAt).toLocaleString()}"`,
          `"${fullName}"`,
          `"${sub.email}"`,
          `"${sub.phone || ''}"`,
          `"${sub.role}"`,
          `"${sub.sectionName}"`,
          `"${sub.id}"`
        ];
        csvRows.push(row.join(','));
      });
      
      const csvString = csvRows.join('\n');
      const blob = new Blob([csvString], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `rfds_submissions_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    loadData();
  </script>
</body>
</html>
